<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Budget Perso</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
</head>
<body>

  <div class="grain"></div>

  <header>
    <div class="header-left">
      <span class="logo">₿udget</span>
      <span class="subtitle">— tracker personnel</span>
    </div>
    <div class="header-right">
      <span class="date-display" id="dateDisplay"></span>
    </div>
  </header>

  <main>

    <!-- Solde principal -->
    <section class="balance-card">
      <p class="balance-label">Solde actuel</p>
      <h1 class="balance-amount" id="balanceAmount">0,00 €</h1>
      <div class="balance-meta">
        <div class="meta-item income">
          <span class="meta-icon">↑</span>
          <div>
            <p class="meta-label">Revenus</p>
            <p class="meta-value" id="totalIncome">0,00 €</p>
          </div>
        </div>
        <div class="divider-v"></div>
        <div class="meta-item expense">
          <span class="meta-icon">↓</span>
          <div>
            <p class="meta-label">Dépenses</p>
            <p class="meta-value" id="totalExpenses">0,00 €</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Formulaire -->
    <section class="form-section">
      <h2 class="section-title">Nouvelle transaction</h2>
      <div class="form-card">
        <div class="type-toggle">
          <button class="toggle-btn active" id="btnRevenu" onclick="setType('revenu')">Revenu</button>
          <button class="toggle-btn" id="btnDepense" onclick="setType('depense')">Dépense</button>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="description">Description</label>
            <input type="text" id="description" placeholder="Ex: Loyer, Salaire…" autocomplete="off"/>
          </div>
          <div class="form-group small">
            <label for="montant">Montant (€)</label>
            <input type="number" id="montant" placeholder="0.00" min="0" step="0.01"/>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="categorie">Catégorie</label>
            <select id="categorie">
              <option value="Alimentation">🛒 Alimentation</option>
              <option value="Transport">🚗 Transport</option>
              <option value="Logement">🏠 Logement</option>
              <option value="Loisirs">🎮 Loisirs</option>
              <option value="Santé">💊 Santé</option>
              <option value="Salaire">💼 Salaire</option>
              <option value="Autre">📦 Autre</option>
            </select>
          </div>
          <div class="form-group small">
            <label for="dateInput">Date</label>
            <input type="date" id="dateInput"/>
          </div>
        </div>

        <button class="add-btn" onclick="addTransaction()">
          <span>+ Ajouter</span>
        </button>
      </div>
    </section>

    <!-- Transactions -->
    <section class="transactions-section">
      <div class="section-header">
        <h2 class="section-title">Historique</h2>
        <button class="clear-btn" onclick="clearAll()">Tout effacer</button>
      </div>
      <div class="filter-bar">
        <button class="filter-btn active" onclick="filterTransactions('all', this)">Tout</button>
        <button class="filter-btn" onclick="filterTransactions('revenu', this)">Revenus</button>
        <button class="filter-btn" onclick="filterTransactions('depense', this)">Dépenses</button>
      </div>
      <ul class="transaction-list" id="transactionList">
        <li class="empty-state" id="emptyState">
          <span class="empty-icon">◎</span>
          <p>Aucune transaction pour l'instant.</p>
        </li>
      </ul>
    </section>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
